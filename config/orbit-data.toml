value = "glo-ops"
minimum_records = 1
maximum_count_drop_fraction = 0.35

[[gp.datasets]]
name = "beidou"
query = "GROUP"
value = "beidou"
minimum_records = 1
maximum_count_drop_fraction = 0.35

[[gp.datasets]]
