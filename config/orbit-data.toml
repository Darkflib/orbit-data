[service]
name = "orbit-data"

[storage]
root = "/data"
releases_to_keep = 3

[gp]
base_url = "https://celestrak.org/NORAD/elements/gp.php"
user_agent = "orbit-data/0.1 (+https://github.com/Darkflib/orbit-data)"
# CelesTrak's floor is 2 hours per query, but the timer now fires every 6 hours
# because the underlying 18 SDS feed only updates 2-3 times a day. 7500s keeps a
# five-minute cushion above that 2h floor, so an out-of-band `sync-gp` cannot
# undercut it even with clock skew across a volume failover.
minimum_interval_seconds = 7500
# A connect timeout means CelesTrak never received the request, so it costs them
# nothing and does not spend the floor above. Retry in minutes instead of
# surrendering a whole cycle to a dropped packet.
network_retry_interval_seconds = 900
# CelesTrak firewalls IP addresses pulling more than 100 MB/day, and gp.php
# serves no compression — which is why the fetch asks for FORMAT=CSV and builds
# the published JSON locally. This is a backstop against a misedited dataset
# list; the primary control is the timer cadence.
maximum_daily_bytes = 83886080
connect_timeout_seconds = 10
read_timeout_seconds = 90
# A backstop against a runaway body, sized against what now crosses the wire:
# the largest response is `active` at roughly 2.5 MB of CSV. This was 64 MiB
# when the wire format was JSON, and a ceiling twenty-five times the largest
# expected response has stopped being a backstop at all.
maximum_response_bytes = 25165824

# Only three queries reach CelesTrak. Everything else this service publishes is
# filtered out of `active` locally — see [[gp.derived]] below for why, and for
# what that costs in fidelity.
[[gp.datasets]]
name = "active"
query = "GROUP"
value = "active"
minimum_records = 10000
maximum_count_drop_fraction = 0.20
# The only large query left, and now the source for ten published datasets
# rather than one: ~16,300 objects at roughly 152 uncompressed bytes per OMM
# record as CSV, about 2.5 MB per download. The same records are published as
# JSON at roughly 420 bytes each — about 6.9 MB on disk — but that document is
# built here and never crosses CelesTrak's wire, so it is the CSV figure this
# cap rations. 4 MiB leaves ~40% headroom for catalogue growth while keeping a
# single GROUP from quietly consuming the whole 80 MiB daily allowance if a
# query ever returns something far larger than expected. Raise this deliberately
# rather than letting it drift; it is a ration, not a size assertion.
maximum_bytes = 4194304

# Not derivable from `active`, and the reason this is still fetched. The group
# is the ISS and CSS complexes, their visiting crew and cargo craft, and the
# smallsats deployed from them — an editorial selection with no name pattern
# and no orbital signature. It is also ~3 KB on the wire, so deriving it would
# save nothing. Two of its members are debris `active` does not carry at all.
[[gp.datasets]]
name = "stations"
query = "GROUP"
value = "stations"
minimum_records = 1
maximum_count_drop_fraction = 0.35

# Also not derivable: a curated watch list that is mostly *not* active. Of 77
# objects on a recent pull, 12 were debris or spent rocket bodies absent from
# `active` — a FENGYUN 1C fragment, a CZ-2C body, ISS debris. ~12 KB as CSV.
[[gp.datasets]]
name = "special-decaying"
query = "SPECIAL"
value = "DECAYING"
minimum_records = 1
maximum_count_drop_fraction = 0.90

# ---------------------------------------------------------------------------
# Derived datasets: published from `active`, no request of their own.
#
# CelesTrak enforces one download per update on the Active and Starlink GROUPs
# and states plainly that fetching a GROUP alongside the Active list containing
# it is the waste the policy exists to stop. Every constellation GROUP this
# service used to fetch was confirmed a strict subset of `active` by comparing
# NORAD catalogue numbers across a full pull of all twelve: 10,906 of 10,906
# for starlink, and 100% for oneweb, kuiper, qianfan, hulianwang, geo and all
# four GNSS groups. Only `stations` (2 debris objects) and `special-decaying`
# (12) held anything `active` did not, which is why those two are still fetched.
#
# What `active` does not carry is membership — an OMM record does not say which
# constellation it belongs to — so each rule below reconstructs it. The counts
# in each comment are measured against CelesTrak's own grouping on a full pull,
# stated as "extra" (we include, they do not) and "missing" (they include, we
# do not). They are not zero, and they are not expected to become zero: the
# `-ops` GNSS groups encode an operational-status judgement that no field in
# the OMM record carries.
#
# Consumers see no difference: each publishes to /v1/gp/<name>.json exactly as
# the fetched GROUP did.
# ---------------------------------------------------------------------------

# Restored here after being dropped as a fetch entirely. It was ~4.6 MB per
# cycle and the first GROUP named under one-download-per-update enforcement;
# as a filter it costs nothing. The 2 extra are objects named STARLINK that
# CelesTrak had not (or no longer) placed in the group.
[[gp.derived]]
name = "starlink"
source = "active"
pattern = "^STARLINK"
minimum_records = 5000
maximum_count_drop_fraction = 0.20

[[gp.derived]]
name = "oneweb"
source = "active"
pattern = "^ONEWEB"
minimum_records = 100
maximum_count_drop_fraction = 0.35

[[gp.derived]]
name = "kuiper"
source = "active"
pattern = "^KUIPER"
minimum_records = 50
maximum_count_drop_fraction = 0.50

[[gp.derived]]
name = "qianfan"
source = "active"
pattern = "^QIANFAN"
minimum_records = 50
maximum_count_drop_fraction = 0.50

# Guowang / China SatNet, which CelesTrak files under "hulianwang". The widest
# of these rules: ~23 extra on a recent pull. Nine are HULIANWANG DIGUI craft
# CelesTrak had not yet added to the group, five are HULIANWANG JISHU SHIYAN
# technology demonstrators, and nine are GUOWANG OBJECT entries that duplicate
# the names of group members under different catalogue numbers — genuinely
# ambiguous by name, since the names are identical. Full recall is preferred
# here over precision: the frontend resolves an object claimed by two layers by
# priority, so an extra shows up as a colour, never as a duplicate.
[[gp.derived]]
name = "hulianwang"
source = "active"
pattern = "^(HULIANWANG|GUOWANG)"
minimum_records = 50
maximum_count_drop_fraction = 0.50

# GPS. ~8 extra: decommissioned NAVSTARs still in orbit and still tracked,
# which CelesTrak excludes from the operational `gps-ops` list. SATCAT's
# OPS_STATUS_CODE would remove them exactly, but that lives in the catalogue
# job on a different cadence, and coupling the two to drop eight satellites
# from a colour-coded layer is not a trade worth making yet.
[[gp.derived]]
name = "gps-ops"
source = "active"
pattern = "^NAVSTAR"
minimum_records = 20
maximum_count_drop_fraction = 0.35

# Galileo names its craft GSAT0101, GSAT0201 and so on. The four-digit run is
# load-bearing: ISRO's unrelated GSAT-8, GSAT-30 and friends are hyphenated,
# and a bare "^GSAT" pulls in 17 of them. Exact against the group as written.
[[gp.derived]]
name = "galileo"
source = "active"
pattern = "^GSAT\\d{4}"
minimum_records = 20
maximum_count_drop_fraction = 0.35

# Exact against the group. GLONASS craft carry the constellation name in
# parentheses after their COSMOS designation, so this is deliberately not
# anchored to the start of the name.
[[gp.derived]]
name = "glo-ops"
source = "active"
pattern = "GLONASS"
minimum_records = 15
maximum_count_drop_fraction = 0.35

# ~2 extra: BEIDOU-2 G1 and G3, retired GEO craft that CelesTrak drops from the
# operational list while keeping G4. No name pattern separates them. Filtering
# on operational status instead would remove both but also lose four genuine
# members, so the two extra are the smaller error.
[[gp.derived]]
name = "beidou"
source = "active"
pattern = "^BEIDOU"
minimum_records = 20
maximum_count_drop_fraction = 0.35

# An orbital regime rather than a family of names, so this selects on mean
# motion alone. A true geosynchronous orbit is 1.0027 revolutions per day; the
# window is wide enough to hold the drifting and inclined craft CelesTrak keeps
# in the group. ~18 extra, nothing missing, on a recent pull.
[[gp.derived]]
name = "geo"
source = "active"
minimum_mean_motion = 0.95
maximum_mean_motion = 1.05
minimum_records = 200
maximum_count_drop_fraction = 0.35

[catalog]
satcat_url = "https://celestrak.org/pub/satcat.csv"
gcat_url = "https://planet4589.org/space/gcat/tsv/cat/satcat.tsv"
user_agent = "orbit-data/0.1 (+https://github.com/Darkflib/orbit-data)"
vendor_root = "/app/vendor"
connect_timeout_seconds = 10
read_timeout_seconds = 120
maximum_response_bytes = 134217728
minimum_satcat_records = 20000
maximum_record_drop_fraction = 0.20
minimum_gcat_join_fraction = 0.40
minimum_magnitude_records = 3000
minimum_star_records = 800
minimum_constellation_records = 80

# Thresholds for `check-health`. Every key is optional and falls back to the
# value shown, so an older deployed copy of this file still monitors correctly.
# Warnings are logged and exit 0; a critical fails the unit so systemd's
# OnFailure= can page.
[health]
# The GP timer fires every 6h, but `last_success` only advances when CelesTrak
# actually has new data — the 18 SDS feed updates 2-3 times a day, and the runs
# in between answer HTTP 403 "not updated". A healthy dataset can sit at 12h.
gp_warning_age_seconds = 64800
gp_critical_age_seconds = 129600
# The catalogue is daily with up to 30 minutes of jitter.
catalog_warning_age_seconds = 129600
catalog_critical_age_seconds = 259200
free_bytes_warning = 2147483648
free_bytes_critical = 536870912
