[catalog]
satcat_url = "https://celestrak.org/pub/satcat.csv"
gcat_url = "https://planet4589.org/space/gcat/tsv/cat/satcat.tsv"
user_agent = "orbit-data/0.1 (+https://github.com/Darkflib/orbit-data)"
vendor_root = "/app/vendor"
connect_timeout_seconds = 10
read_timeout_seconds = 120
maximum_response_bytes = 134217728
minimum_satcat_records = 20000
maximum_record_drop_fraction = 0.20
minimum_gcat_join_fraction = 0.40
minimum_magnitude_records = 3000
minimum_star_records = 800
minimum_constellation_records = 80

# Thresholds for `check-health`. Every key is optional and falls back to the
# value shown, so an older deployed copy of this file still monitors correctly.
# Warnings are logged and exit 0; a critical fails the unit so systemd's
# OnFailure= can page.
[health]
# The GP timer fires every 2h10m, so 6h is roughly three missed runs.
gp_warning_age_seconds = 21600
gp_critical_age_seconds = 43200
# The catalogue is daily with up to 30 minutes of jitter.
catalog_warning_age_seconds = 129600
catalog_critical_age_seconds = 259200
free_bytes_warning = 2147483648
free_bytes_critical = 536870912
