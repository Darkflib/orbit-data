[service]
name = "orbit-data"

[storage]
root = "/data"
releases_to_keep = 3

[gp]
base_url = "https://celestrak.org/NORAD/elements/gp.php"
user_agent = "orbit-data/0.1 (+https://github.com/Darkflib/orbit-data)"
# CelesTrak's floor is 2 hours per query, but the timer now fires every 6 hours
# because the underlying 18 SDS feed only updates 2-3 times a day. This stays at
# the documented floor so an out-of-band `sync-gp` cannot undercut it.
minimum_interval_seconds = 7500
# A connect timeout means CelesTrak never received the request, so it costs them
# nothing and does not spend the floor above. Retry in minutes instead of
# surrendering a whole cycle to a dropped packet.
network_retry_interval_seconds = 900
# CelesTrak firewalls IP addresses pulling more than 100 MB/day, and gp.php
# serves no compression. This is a backstop against a misedited dataset list;
# the primary control is the timer cadence.
maximum_daily_bytes = 83886080
connect_timeout_seconds = 10
read_timeout_seconds = 90
maximum_response_bytes = 67108864

[[gp.datasets]]
name = "stations"
query = "GROUP"
value = "stations"
minimum_records = 1
maximum_count_drop_fraction = 0.35

[[gp.datasets]]
name = "gps-ops"
query = "GROUP"
value = "gps-ops"
minimum_records = 1
maximum_count_drop_fraction = 0.35

[[gp.datasets]]
name = "galileo"
query = "GROUP"
value = "galileo"
minimum_records = 1
maximum_count_drop_fraction = 0.35

[[gp.datasets]]
name = "glo-ops"
query = "GROUP"
value = "glo-ops"
minimum_records = 1
maximum_count_drop_fraction = 0.35

[[gp.datasets]]
name = "beidou"
query = "GROUP"
value = "beidou"
minimum_records = 1
maximum_count_drop_fraction = 0.35

[[gp.datasets]]
name = "geo"
query = "GROUP"
value = "geo"
minimum_records = 1
maximum_count_drop_fraction = 0.35

[[gp.datasets]]
name = "oneweb"
query = "GROUP"
value = "oneweb"
minimum_records = 1
maximum_count_drop_fraction = 0.35

# The `starlink` GROUP is deliberately absent. It is ~10,900 objects and a
# strict subset of `active`, which we already fetch; CelesTrak's documentation
# names the pair explicitly ("There is no need to download the list of active
# satellites and the list of all Starlink satellites, since the latter is a
# subset of the former") and names Active and Starlink as the first two GROUPs
# under one-download-per-update enforcement. Together they were ~11.6 MB of a
# ~12.4 MB run, and at the old 2h10m cadence that put this service around
# 133 MB/day against a documented 100 MB/day firewall threshold. Derive Starlink
# from `active` downstream rather than restoring this entry.

[[gp.datasets]]
name = "kuiper"
query = "GROUP"
value = "kuiper"
minimum_records = 1
maximum_count_drop_fraction = 0.50

[[gp.datasets]]
name = "qianfan"
query = "GROUP"
value = "qianfan"
minimum_records = 1
maximum_count_drop_fraction = 0.50

[[gp.datasets]]
name = "hulianwang"
query = "GROUP"
value = "hulianwang"
minimum_records = 1
maximum_count_drop_fraction = 0.50

[[gp.datasets]]
name = "active"
query = "GROUP"
value = "active"
minimum_records = 10000
maximum_count_drop_fraction = 0.20

[[gp.datasets]]
name = "special-decaying"
query = "SPECIAL"
value = "DECAYING"
minimum_records = 1
maximum_count_drop_fraction = 0.90

[catalog]
satcat_url = "https://celestrak.org/pub/satcat.csv"
gcat_url = "https://planet4589.org/space/gcat/tsv/cat/satcat.tsv"
user_agent = "orbit-data/0.1 (+https://github.com/Darkflib/orbit-data)"
vendor_root = "/app/vendor"
connect_timeout_seconds = 10
read_timeout_seconds = 120
maximum_response_bytes = 134217728
minimum_satcat_records = 20000
maximum_record_drop_fraction = 0.20
minimum_gcat_join_fraction = 0.40
minimum_magnitude_records = 3000
minimum_star_records = 800
minimum_constellation_records = 80

# Thresholds for `check-health`. Every key is optional and falls back to the
# value shown, so an older deployed copy of this file still monitors correctly.
# Warnings are logged and exit 0; a critical fails the unit so systemd's
# OnFailure= can page.
[health]
# The GP timer fires every 6h, but `last_success` only advances when CelesTrak
# actually has new data — the 18 SDS feed updates 2-3 times a day, and the runs
# in between answer HTTP 403 "not updated". A healthy dataset can sit at 12h.
gp_warning_age_seconds = 64800
gp_critical_age_seconds = 129600
# The catalogue is daily with up to 30 minutes of jitter.
catalog_warning_age_seconds = 129600
catalog_critical_age_seconds = 259200
free_bytes_warning = 2147483648
free_bytes_critical = 536870912
