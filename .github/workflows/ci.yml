name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pylint src tests
      - run: uv run bandit -c pyproject.toml -r src
      - run: uv run pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install --yes podman
      - name: Build image
        run: podman build --tag orbit-data:test .
      - name: Smoke test image
        run: podman run --rm orbit-data:test --help
      - name: Validate Caddy configuration
        run: |
          podman run --rm --read-only --user 65532:65532 \
            --security-opt=no-new-privileges --cap-drop all --cap-add NET_BIND_SERVICE \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            docker.io/library/caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Smoke test read-only static server
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'podman rm --force orbit-data-caddy >/dev/null 2>&1 || true' EXIT
          chmod 0755 "$test_root"
          mkdir -p "$test_root/releases/catalog/test" "$test_root/public/v1"
          printf '%s\n' '{"schemaVersion":1}' > "$test_root/releases/catalog/test/manifest.json"
          ln -s ../../releases/catalog/test "$test_root/public/v1/data"
          podman run --detach --name orbit-data-caddy --read-only --user 65532:65532 \
            --security-opt=no-new-privileges --cap-drop all --cap-add NET_BIND_SERVICE \
            --publish 127.0.0.1::8080 \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --volume "$test_root:/srv/orbit-data:ro" \
            docker.io/library/caddy:2.11.4-alpine \
            caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          port="$(podman port orbit-data-caddy 8080/tcp | sed 's/.*://')"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent "http://127.0.0.1:${port}/healthz"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:${port}/v1/data/manifest.json"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless: hosts refuse unsigned images (Darkflib/gitops policy)
      attestations: write # provenance and SBOM, recorded against this repo
    outputs:
      image: ${{ steps.publish.outputs.image }}
      tag: ${{ steps.publish.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install --yes podman
      - name: Build and publish
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman build --tag "$image:sha-${GITHUB_SHA}" --tag "$image:latest" .
          # The digest the registry stored is what gets signed and pinned.
          podman push --digestfile digest "$image:sha-${GITHUB_SHA}"
          podman push "$image:latest"
          digest="$(cat digest)"
          # cosign login writes ~/.docker/config.json, which is where syft and the attest actions
          # below look for credentials (the actions read that file and nothing else).
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$image@${digest}"
          { echo "image=$image"; echo "tag=sha-${GITHUB_SHA}"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"
          echo "Signed: \`$image:sha-${GITHUB_SHA}@${digest}\`. Promoted by the next job; by hand, from a Darkflib/gitops checkout: \`python3 quadlet/bin/promote.py orbit $image sha-${GITHUB_SHA} --pr\`" >> "$GITHUB_STEP_SUMMARY"

      # SLSA provenance and an SPDX SBOM on the signed digest, stored beside the image
      # (push-to-registry). Darkflib/gitops's policy.toml requires both ("github" kind) before
      # promote.py pins a build, and checks the provenance names this repository.
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      # From the pushed image rather than the local build, so it describes the bytes the
      # registry serves.
      - name: Generate an SBOM
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: syft "registry:${IMAGE}@${DIGEST}" -o "spdx-json=$RUNNER_TEMP/sbom.spdx.json"

      # actions/attest rather than the deprecated actions/attest-sbom, which now wraps it.
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom.spdx.json
          retention-days: 90

      # Produced is not verified. The same checks promote.py makes: the signature and both
      # attestations, against this workflow's own identity. The SBOM's predicate type is the
      # versioned one GitHub records; cosign matches it exactly.
      - name: Verify the signature and both attestations
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          issuer=https://token.actions.githubusercontent.com
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$issuer" \
            "${IMAGE}@${DIGEST}" >/dev/null
          for type in slsaprovenance1 https://spdx.dev/Document/v2.3; do
            cosign verify-attestation --type "$type" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$issuer" \
              "${IMAGE}@${DIGEST}" >/dev/null
          done
          echo "signature, provenance and SBOM verify for ${IMAGE}@${DIGEST}"

  # Opens the pin as a PR in Darkflib/gitops and merges it once that repository's checks pass.
  # Nothing here touches a host: each host's reconcile agent pulls the merged pin and verifies
  # the signature again before running anything.
  #
  # Secrets:
  #   GITOPS_TOKEN  contents:write + pull-requests:write on Darkflib/gitops
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15 # promote.py waits up to 8 for the PR's checks
    permissions:
      contents: read
      packages: read # promote.py reads the manifest and its signature
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - name: Require GITOPS_TOKEN
        # Without this the failure is actions/checkout complaining about an empty token.
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::error::GITOPS_TOKEN is not set on this repository, so $IMAGE:$TAG is published and signed but not promoted. Add the secret (contents:write and pull-requests:write on Darkflib/gitops) and re-run this job, or promote by hand from a gitops checkout: python3 quadlet/bin/promote.py orbit $IMAGE $TAG --pr"
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR for cosign
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Check out gitops
        # Credentials persist on purpose: promote.py pushes the promote branch with them.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Darkflib/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Promote
        # Verifies the signature against policy.toml, pins the digest and opens a PR, and merges
        # it once its checks pass.
        # Does nothing if this digest is already pinned.
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GHCR_TOKEN: ${{ github.token }}
        working-directory: gitops
        run: |
          git config user.name "orbit-publish"
          git config user.email "orbit-publish@users.noreply.github.com"
          python3 quadlet/bin/promote.py orbit "$IMAGE" "$TAG" --pr
